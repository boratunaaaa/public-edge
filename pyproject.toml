[project]
name = "public-edge"
version = "1.0.0"
description = "PUBLIC EDGE - US public financial disclosure event detection and research alerts (no trading)."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    "httpx==0.28.1",
    "lxml==5.3.0",
    "pdfplumber==0.11.4",
    "python-dateutil==2.9.0.post0",
    "jinja2==3.1.5",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
